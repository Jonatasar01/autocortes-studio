name: Tests
on:
  # Push só no branch principal: em branches com PR o evento pull_request já
  # cobre o código, e rodar os dois duplicava todos os jobs (e o consumo de minutos).
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
concurrency:
  # Um novo push no mesmo PR/branch cancela a execução anterior ainda em andamento.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.12']
    timeout-minutes: 40
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - name: Require real media dependencies
        run: uv run --no-sync python -c "from app.media import ffmpeg_capabilities; c=ffmpeg_capabilities(); print(c); assert all(c[k] for k in ('ffmpeg','ffprobe','libass','libx264'))"
      - run: uv run --no-sync python -m pytest -q -ra --junitxml=test-results.xml
        env:
          OLLAMA_ENABLED: '0'
          AUTOCORTES_FFMPEG_THREADS: '2'
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
