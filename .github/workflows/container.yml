name: Container smoke test
on:
  # Push só no branch principal: em branches com PR o evento pull_request já
  # cobre o código, e rodar os dois duplicava todos os jobs (e o consumo de minutos).
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
concurrency:
  # Um novo push no mesmo PR/branch cancela a execução anterior ainda em andamento.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  container:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Verify media and AI dependencies
        run: >-
          docker compose exec -T autocortes python -c
          "import cv2, faster_whisper; from app.media import ffmpeg_capabilities;
          c=ffmpeg_capabilities(); print(c);
          assert all(c[k] for k in ('ffmpeg','ffprobe','libass','libx264'))"
      - name: Verify host access
        run: curl --fail http://127.0.0.1:8002/api/health
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down
