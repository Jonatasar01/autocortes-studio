[project]
name = "autocortes-studio-local"
version = "2.4.0"
description = "Editor local de cortes de vídeo com transcrição e automação"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ai = [
  "faster-whisper>=1.1,<2",
  # faster-whisper 1.2.x usa metadata_errors, removido no PyAV 19.
  "av>=11,<19",
  "opencv-python-headless>=4.8,<5",  # o OpenCV 5 tirou o CascadeClassifier (detecção de rostos)
  "numpy>=1.24",
]
music = ["requests>=2.31,<3"]
links = ["yt-dlp[default]>=2026.1.1"]
tts = ["edge-tts>=7.2,<8"]  # narração dos vídeos com coluna script (app/audio/tts_generator.py)
# Transcrição na GPU NVIDIA no Windows: DLLs do CUDA 12 que o CTranslate2 procura (~1,2 GB).
gpu = [
  "nvidia-cublas-cu12>=12.4,<13; sys_platform == 'win32'",
  "nvidia-cudnn-cu12>=9.1,<10; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.uv]
package = false
